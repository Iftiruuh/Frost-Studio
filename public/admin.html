<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frost Studio | Orders</title>
  <style>
    body{margin:0;background:#fbf7f2;color:#2d2421;font-family:Arial,sans-serif}
    .wrap{max-width:1150px;margin:auto;padding:36px 20px}
    h1,h2{font-family:Georgia,serif;color:#4a342c}
    .top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}
    .auth{display:flex;gap:8px;flex-wrap:wrap}
    input,button{padding:11px 13px;border:1px solid #d8cabe;border-radius:10px;font:inherit}
    button{background:#4a342c;color:white;cursor:pointer;font-weight:700}
    .order{background:#fffdf9;border:1px solid #eadfd4;border-radius:18px;padding:20px;margin-top:16px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#7a675f}
    .value{font-weight:700}
    .items{margin-top:14px;border-top:1px solid #eee2d8;padding-top:12px}
    .item{display:flex;justify-content:space-between;gap:14px;padding:5px 0}
    .status{display:inline-block;padding:5px 9px;border-radius:999px;background:#f1e6dc;font-size:12px;font-weight:700}
    .ref{margin-top:10px}
    .ref img{max-width:220px;border-radius:12px;border:1px solid #eadfd4}
    .empty{padding:28px;text-align:center;color:#7a675f}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Frost Studio Orders</h1>
      <p>Private owner dashboard for submitted customer order requests.</p>
    </div>
    <div class="auth">
      <input id="adminKey" type="password" placeholder="Admin key">
      <button id="loadBtn">Load Orders</button>
    </div>
  </div>
  <div id="orders"><div class="empty">Enter your admin key to load orders.</div></div>
</div>
<script>
const ordersEl = document.getElementById('orders');
document.getElementById('loadBtn').addEventListener('click', loadOrders);

function money(v){return '৳'+Number(v).toLocaleString('en-BD')}

async function loadOrders(){
  const key = document.getElementById('adminKey').value;
  const response = await fetch('/api/admin/orders', {headers:{'x-admin-key':key}});
  const data = await response.json();
  if(!response.ok){
    ordersEl.innerHTML = '<div class="empty">'+(data.error||'Could not load orders')+'</div>';
    return;
  }
  if(!data.orders.length){
    ordersEl.innerHTML = '<div class="empty">No orders yet.</div>';
    return;
  }
  ordersEl.innerHTML = data.orders.map(o => `
    <div class="order">
      <div class="grid">
        <div><div class="label">Order</div><div class="value">${o.orderId}</div></div>
        <div><div class="label">Customer</div><div class="value">${o.customerName}</div></div>
        <div><div class="label">Phone</div><div class="value">${o.customerPhone}</div></div>
        <div><div class="label">Required</div><div class="value">${o.requiredDate} ${o.requiredTime}</div></div>
        <div><div class="label">Fulfilment</div><div class="value">${o.fulfilment}</div></div>
        <div><div class="label">Menu Total</div><div class="value">${money(o.subtotal)}</div></div>
      </div>
      <div class="items">
        ${o.items.map(i => `<div class="item"><span>${i.name} × ${i.qty}${i.detail ? ' ('+i.detail+')':''}</span><strong>${money(i.price*i.qty)}</strong></div>`).join('')}
      </div>
      ${o.deliveryAddress ? `<p><strong>Delivery:</strong> ${o.deliveryAddress}</p>` : ''}
      ${o.cakeMessage ? `<p><strong>Cake message:</strong> ${o.cakeMessage}</p>` : ''}
      ${o.customInstructions ? `<p><strong>Instructions:</strong> ${o.customInstructions}</p>` : ''}
      <p><span class="status">${o.status}</span> Submitted ${new Date(o.createdAt).toLocaleString()}</p>
      ${o.referenceImageUrl ? `<div class="ref"><a href="${o.referenceImageUrl}" target="_blank"><img src="${o.referenceImageUrl}" alt="Reference image"></a></div>` : ''}
    </div>
  `).join('');
}
</script>
</body>
</html>
